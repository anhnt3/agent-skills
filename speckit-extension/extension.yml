schema_version: "1.0"

extension:
  id: "dft-speckit"
  name: "DFT Spec Kit Extension"
  version: "0.2.3"
  description: "Bộ command dùng chung của DFT cho Spec Kit — tập hợp các command hỗ trợ quy trình spec-driven development của công ty. Sẽ mở rộng dần nhiều command."
  author: "Nguyen Tuan Anh"
  repository: "https://github.com/anhnt3/agent-skills"
  license: "MIT"

requires:
  # >=0.6.0: các command dùng AskUserQuestion trên Claude Code (như dft-preset).
  # Đã kiểm tương thích với spec-kit 0.12.11 — xem docs/research/speckit-addon-review-2026-07-11.md.
  speckit_version: ">=0.6.0"

provides:
  # Danh sách command dùng chung của DFT — thêm command mới vào đây khi phát sinh.
  commands:
    - name: "speckit.dft-speckit.qa-spec-cycle"
      file: "commands/qa-spec-cycle.md"
      description: "QA trọn vòng từ 1 file spec — sinh testcase thủ công (xlsx 2 sheet, 17 cột), sinh test tự động theo pyramid, tự dựng môi trường và chạy, báo cáo, fix có kiểm soát, ghi ma trận truy vết. Pha 0 chốt NGUỒN NỘI DUNG: file BRD của item có mục 'Từ điển dữ liệu' và các dòng QT-nn mang 'Cách kiểm' (do /speckit.specify BỔ SUNG — chèn thêm theo Cockburn/RUP + ISO 29148 + 25010, không tạo mục FR, số hiệu mục không cố định theo dự án) và qua cổng tươi-mới (số SC-### khớp spec.md + sha1 của spec.md khớp dòng ghi ở Nhật ký cập nhật) → SOURCE=brd, đọc BRD, KHÔNG đọc spec.md; không nhận diện được / bản cũ → SOURCE=spec, chạy như cũ (degrade hợp lệ). Pha 3 lấy thẳng 'Cách kiểm' của từng QT làm tầng test, đổi khác phải nêu lý do. Neo coverage: SOURCE=brd → QT/TR/S/SC + điều khiển + tiền điều kiện (id chạy DK-nn); SOURCE=spec → FR/SC; graceful: nguồn theo cấu trúc một-nhà (preset DFT) thì đọc thêm Từ điển dữ liệu (boundary test) + Đặc tả màn hình (case UI: 4 trạng thái/cột/lọc/quyền) + Tiêu chí chấp nhận (Given→Tiền điều kiện, Then→Kết quả mong đợi, Edge Cases), nguồn plain thì chạy như cũ. Pha 4b đối chiếu LUẬT quy ước chung references/quy-uoc-chung.md (độ dài trường §2, luật input + thông báo validation §3/§11, form §8, dialog xoá §9, toast §10, data grid §7, tệp §4, nhập/xuất §13 gồm ca chống công thức Excel, trùng dữ liệu §17, phân quyền §19/§21) — chuỗi trong ngoặc kép dùng nguyên văn, xung đột spec↔QUCTHT thì hỏi chứ không tự chọn bên. Cột 17 'Nguồn BRD' (bốn giá trị, hậu tố ' (SPEC)' phân biệt mục BA viết với mục công cụ chiếu sang) truy ngược case về mục BRD qua trường Nguồn của roadmap. E2E định vị phần tử bằng data-testid làm mặc định cứng (thang ưu tiên testid → role + accessible name ARIA, cấm CSS/xpath/text/getByLabel; hàng bảng ghép khoá nghiệp vụ chứ không index) — thiếu testid thì thêm vào source qua Blocker 2 Pha 7 chứ không hạ bậc selector, và Pha 2 cấu hình recorder/codegen trỏ đúng data-testid để tester thủ công record một lượt là chạy lại bền. Technology-agnostic (đặc thù stack đọc từ .agents/qa-context.md); thay cho command manual-xlsx cũ (Pha 4 của vòng này)."

    - name: "speckit.dft-speckit.road-map-from-codebase"
      file: "commands/road-map-from-codebase.md"
      description: "Lập/cập nhật roadmap build từ codebase — xếp thứ tự từng màn, ghi docs/roadmap.md (không clobber trạng thái/nợ)."

    - name: "speckit.dft-speckit.domain-design"
      file: "commands/domain-design.md"
      description: "Thiết kế/cập nhật domain tổng thể cho một CỤM CHỨC NĂNG chỉ định bằng danh sách RM-xxx trong roadmap (validate cứng: chỉ nhận RM-xxx hoặc khoảng RM-a..RM-b, KHÔNG nhận tên module và không tự nở module thành RM; 1 doc = 1 bounded context vì entity không map 1-1 với màn) — rút entity/FK/enum/rule từ BRD (docs/brd/, lần theo trường Nguồn của roadmap) và codebase, ghi docs/domain/<cụm>.md làm nền model cho /speckit.specify từng RM. RM đã design lần trước thì MỞ RỘNG doc đang phủ, không sinh doc trùng (registry `Phủ RM` + đối chiếu entity §1 của mọi doc); `Phủ module` khai rõ đầy đủ hay một phần. Mỏ neo N/E + luật không entity nào gánh quá 1/2 số RM chống doc rỗng ruột; no-clobber Câu hỏi mở + quyết định đã chốt. Cần roadmap làm đầu vào; chạy được cả khi chưa có dòng code nào."

    - name: "speckit.dft-speckit.init-agents"
      file: "commands/init-agents.md"
      description: "Dò stack thật của project (theo tín hiệu khai trong agents/registry.yml — glob/grep, có bằng chứng file), lọc đúng agent phù hợp trong catalog DFT rồi cài vào .claude/agents/ để /speckit.agent-assign.assign có agent mà gán vào task. Không đổ cả catalog (agent sai stack làm nhiễu bước tự-khớp). Chỉ hỗ trợ integration claude — agent-assign hardcode đường quét .claude/agents/. Hỏi trước khi ghi đè, không clobber file sửa tay."

    - name: "speckit.dft-speckit.road-map-from-brd"
      file: "commands/road-map-from-brd.md"
      description: "Lập roadmap build từ cây BRD markdown docs/brd/ (đầu ra của brd-import, hoặc cây .md BA viết tay — thiếu brd.manifest.yml thì `brd_roadmap.py manifest` dựng/hoà giải từ chính cây thư mục, mỗi file .md là một node, giữ nguyên id cũ) — script trích outline gọn từ brd.manifest.yml, LLM phân loại node (là màn / tách k màn / không phải màn kèm lý do), quét codebase CHỈ để suy phụ thuộc, chốt wave qua 2 lượt interview rồi ghi docs/roadmap.md theo roadmap-template. Cổng cuối là `brd_roadmap.py verify`: mọi node BRD phải có item trỏ tới qua trường Nguồn hoặc bị khai loại kèm lý do, cộng kiểm ID/placeholder/chu trình phụ thuộc/wave nghịch — exit ≠ 0 là cấm báo xong. Dừng nếu docs/roadmap.md đã tồn tại (không merge)."

    - name: "speckit.dft-speckit.brd-import"
      file: "commands/brd-import.md"
      description: "Bẻ một file BRD .docx lớn thành cây markdown nhỏ phản chiếu navigation pane của Word — mỗi mục ở cấp đã chọn là một file, kèm brd.manifest.yml, media/ và reference.docx. Dò cấu trúc 6 bậc (Heading style, style tự chế có outlineLvl, mục lục, đánh số gõ tay, cỡ chữ, LLM phán đoán); LLM chỉ quyết ranh giới, script chép nguyên văn. Kiểm chứng bằng ghép ngược byte-for-byte — lệch 1 byte là không ghi gì. Chạy lại khi đã có docs/brd/ thì xuất ra docs/brd.new/ kèm bảng khác biệt, không đè lên bản BA đã sửa."

    - name: "speckit.dft-speckit.fnlist-import"
      file: "commands/fnlist-import.md"
      description: "Nhập function list (.xlsx/.csv) đã dùng nghiệm thu thành .specify/docs/functions.json — cây chức năng có ID đa cấp FN-01-01 ổn định làm điểm neo truy vết. Script chép nguyên văn và độc quyền ghi file; LLM chỉ quyết ánh xạ cột + kiểu phân cấp (columns/outline/level) rồi xác nhận với người dùng qua checkpoint cây thụt lề. Chạy lại giữ nguyên ID theo đường dẫn tên và giữ tiến độ status, báo diff kèm nhãn chuyển-nhóm cho ca ID buộc phải đổi."

    - name: "speckit.dft-speckit.code-intel"
      file: "commands/code-intel.md"
      description: "Rút đặc tả đủ sâu từ codebase theo cây functions.json, ghi .specify/docs/<đường-dẫn-cây>/intel.md kèm nguồn file:dòng. Tham số là một FN-ID đánh dấu điểm bắt đầu quét (trống = toàn dự án); intel_tree.py đề xuất unit theo luật cha-trực-tiếp-của-lá, LLM trình cây thụt lề xác nhận, rồi quét (hỏi song song qua subagent hay tuần tự khi có nhiều unit). intel_verify.py chấm gate BLOCKING (phủ §1, trần §8, no-clobber §8/§10) + WARNING (phủ §2↔§11) trước khi ghi ngược status qua fnlist_import.py update. Tài liệu nội bộ: khẳng định đọc thẳng từ code ghi kèm nguồn, suy đoán đánh dấu, không căn cứ thì xuống mục câu hỏi. Ghi thêm §10 (phát hiện logic mâu thuẫn/lỗ hổng bảo mật) và §11 (điều khiển giao diện từng màn hình, liên kết §2 qua tên) để srs-from-code đợt sau dùng."

    - name: "speckit.dft-speckit.srs-from-code"
      file: "commands/srs-from-code.md"
      description: "Sinh .specify/docs/<đường-dẫn-cây>/srs.md theo cấu trúc 4 cấp của tài liệu ban hành thật (Nhóm→Chức năng→Sơ đồ/Mục đích/Mô tả chức năng→khối leaf 1-1 với FN-ID function list→a.-g.) từ intel.md và functions.json — nhận một FN-ID gốc (trống = toàn dự án), tái dùng intel_tree.py để đề xuất/xác nhận unit rồi sinh SRS theo batch (song song/tuần tự), chỉ ghi nội dung phản ánh đúng những gì code thật sự làm, thông tin hành chính thiếu thì ghi 'Chưa có thông tin', và tổng hợp một lượt cuối cùng những phát hiện logic/bảo mật đáng chú ý để hỏi người dùng. Chốt bằng cổng srs_verify.py (comment ẩn <!-- FN: ... --> thay cho ma trận truy vết cũ); không còn cờ --template, khung cố định theo đúng một cấu trúc tài liệu ban hành."

  templates:
    - name: "roadmap-template"
      file: "templates/roadmap-template.md"
      description: "Khung cố định cho docs/roadmap.md — bảng tổng thứ tự + khối chi tiết mỗi item (ID/wave/phụ thuộc/trạng thái/nợ)."

    - name: "domain-template"
      file: "templates/domain-template.md"
      description: "Khung cố định cho docs/domain/<module>.md — entity, field chính, FK/quan hệ, enum/error code, rule chung, câu hỏi mở."

    - name: "srs-template"
      file: "templates/srs-template.md"
      description: "Khung mẫu cho .specify/docs/<đường-dẫn-cây>/srs.md, mô phỏng cấu trúc 4 cấp cố định của tài liệu ban hành thật (Nhóm → Chức năng → Sơ đồ/Mục đích/Mô tả chức năng → một khối cho MỖI leaf FN-ID của function list → a.-g., luôn ở cấp heading 6). Hai điểm cố ý lệch docx gốc: khối cấp 5 chia theo leaf FN-ID (không nhóm theo màn hình) để đối chiếu 1-1 với function list, và mục 'Thiết kế UX/UI' + 'Mô tả điều khiển' gộp làm một mục f. để ảnh và bảng điều khiển của cùng một màn nằm cạnh nhau ('Yêu cầu nghiệp vụ' vì vậy là g., tổng bảy mục). Không còn khung I-VI tuỳ biến hay ma trận truy vết cũ; FN-ID kiểm qua comment ẩn <!-- FN: ... --> cấp Chức năng và <!-- FN-leaf: ... --> từng khối. Không còn khung riêng theo khách qua --template."

    - name: "intel-template"
      file: "templates/intel-template.md"
      description: "Khung cho .specify/docs/<đường-dẫn-cây>/intel.md — tài liệu nội bộ rút từ codebase theo một unit của cây functions.json, giữ nguồn file:dòng. Mười hai mục: phủ chức năng, màn hình/điểm vào, thực thể và trường, kiểm tra hợp lệ, luồng nghiệp vụ, phân quyền, tích hợp ngoài, câu hỏi chưa suy được từ code (gắn nhãn loại), thông báo hiển thị, phát hiện logic mâu thuẫn/lỗ hổng bảo mật cần người quyết định, điều khiển giao diện từng màn hình, và kịch bản use case (liên kết §2/§11/§12 qua tên màn hình)."

tags:
  - dft
  - internal
  - qa
  - testcase
  - xlsx
  - manual-testing
