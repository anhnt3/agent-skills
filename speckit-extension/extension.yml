schema_version: "1.0"

extension:
  id: "dft-speckit"
  name: "DFT Spec Kit Extension"
  version: "0.0.11"
  description: "Bộ command dùng chung của DFT cho Spec Kit — tập hợp các command hỗ trợ quy trình spec-driven development của công ty. Sẽ mở rộng dần nhiều command."
  author: "Nguyen Tuan Anh"
  repository: "https://github.com/anhnt3/agent-skills"
  license: "MIT"

requires:
  # >=0.6.0: các command dùng AskUserQuestion trên Claude Code (như dft-preset).
  # Đã kiểm tương thích với spec-kit 0.12.11 — xem docs/research/speckit-addon-review-2026-07-11.md.
  speckit_version: ">=0.6.0"

provides:
  # Danh sách command dùng chung của DFT — thêm command mới vào đây khi phát sinh.
  commands:
    - name: "speckit.dft-speckit.qa-spec-cycle"
      file: "commands/qa-spec-cycle.md"
      description: "QA trọn vòng từ 1 file spec — sinh testcase thủ công (xlsx 2 sheet, 17 cột), sinh test tự động theo pyramid, tự dựng môi trường và chạy, báo cáo, fix có kiểm soát, ghi ma trận truy vết. Neo coverage theo id FR/AC; graceful: nếu spec theo cấu trúc một-nhà (preset DFT) thì đọc thêm Từ điển dữ liệu (boundary test) + Đặc tả màn hình (case UI: 4 trạng thái/cột/lọc/quyền), spec plain thì chạy như cũ. Pha 4b đối chiếu LUẬT quy ước chung references/quy-uoc-chung.md (độ dài trường §2, luật input + thông báo validation §3/§11, form §8, dialog xoá §9, toast §10, data grid §7, tệp §4, nhập/xuất §13 gồm ca chống công thức Excel, trùng dữ liệu §17, phân quyền §19/§21) — chuỗi trong ngoặc kép dùng nguyên văn, xung đột spec↔QUCTHT thì hỏi chứ không tự chọn bên. Cột 17 'Nguồn BRD' truy ngược case về mục BRD qua trường Nguồn của roadmap. Technology-agnostic (đặc thù stack đọc từ .agents/qa-context.md); thay cho command manual-xlsx cũ (Pha 4 của vòng này)."

    - name: "speckit.dft-speckit.road-map-from-codebase"
      file: "commands/road-map-from-codebase.md"
      description: "Lập/cập nhật roadmap build từ codebase — xếp thứ tự từng màn, ghi docs/roadmap.md (không clobber trạng thái/nợ)."

    - name: "speckit.dft-speckit.domain-design"
      file: "commands/domain-design.md"
      description: "Thiết kế/cập nhật domain tổng thể cho một CỤM CHỨC NĂNG chỉ định bằng danh sách RM-xxx trong roadmap (validate cứng: chỉ nhận RM-xxx hoặc khoảng RM-a..RM-b, KHÔNG nhận tên module và không tự nở module thành RM; 1 doc = 1 bounded context vì entity không map 1-1 với màn) — rút entity/FK/enum/rule từ BRD (docs/brd/, lần theo trường Nguồn của roadmap) và codebase, ghi docs/domain/<cụm>.md làm nền model cho /speckit.specify từng RM. RM đã design lần trước thì MỞ RỘNG doc đang phủ, không sinh doc trùng (registry `Phủ RM` + đối chiếu entity §1 của mọi doc); `Phủ module` khai rõ đầy đủ hay một phần. Mỏ neo N/E + luật không entity nào gánh quá 1/2 số RM chống doc rỗng ruột; no-clobber Câu hỏi mở + quyết định đã chốt. Cần roadmap làm đầu vào; chạy được cả khi chưa có dòng code nào."

    - name: "speckit.dft-speckit.init-agents"
      file: "commands/init-agents.md"
      description: "Dò stack thật của project (theo tín hiệu khai trong agents/registry.yml — glob/grep, có bằng chứng file), lọc đúng agent phù hợp trong catalog DFT rồi cài vào .claude/agents/ để /speckit.agent-assign.assign có agent mà gán vào task. Không đổ cả catalog (agent sai stack làm nhiễu bước tự-khớp). Chỉ hỗ trợ integration claude — agent-assign hardcode đường quét .claude/agents/. Hỏi trước khi ghi đè, không clobber file sửa tay."

    - name: "speckit.dft-speckit.road-map-from-brd"
      file: "commands/road-map-from-brd.md"
      description: "Lập roadmap build từ cây BRD markdown docs/brd/ (đầu ra của brd-import, hoặc cây .md BA viết tay — thiếu brd.manifest.yml thì `brd_roadmap.py manifest` dựng/hoà giải từ chính cây thư mục, mỗi file .md là một node, giữ nguyên id cũ) — script trích outline gọn từ brd.manifest.yml, LLM phân loại node (là màn / tách k màn / không phải màn kèm lý do), quét codebase CHỈ để suy phụ thuộc, chốt wave qua 2 lượt interview rồi ghi docs/roadmap.md theo roadmap-template. Cổng cuối là `brd_roadmap.py verify`: mọi node BRD phải có item trỏ tới qua trường Nguồn hoặc bị khai loại kèm lý do, cộng kiểm ID/placeholder/chu trình phụ thuộc/wave nghịch — exit ≠ 0 là cấm báo xong. Dừng nếu docs/roadmap.md đã tồn tại (không merge)."

    - name: "speckit.dft-speckit.brd-import"
      file: "commands/brd-import.md"
      description: "Bẻ một file BRD .docx lớn thành cây markdown nhỏ phản chiếu navigation pane của Word — mỗi mục ở cấp đã chọn là một file, kèm brd.manifest.yml, media/ và reference.docx. Dò cấu trúc 6 bậc (Heading style, style tự chế có outlineLvl, mục lục, đánh số gõ tay, cỡ chữ, LLM phán đoán); LLM chỉ quyết ranh giới, script chép nguyên văn. Kiểm chứng bằng ghép ngược byte-for-byte — lệch 1 byte là không ghi gì. Chạy lại khi đã có docs/brd/ thì xuất ra docs/brd.new/ kèm bảng khác biệt, không đè lên bản BA đã sửa."

  templates:
    - name: "roadmap-template"
      file: "templates/roadmap-template.md"
      description: "Khung cố định cho docs/roadmap.md — bảng tổng thứ tự + khối chi tiết mỗi item (ID/wave/phụ thuộc/trạng thái/nợ)."

    - name: "domain-template"
      file: "templates/domain-template.md"
      description: "Khung cố định cho docs/domain/<module>.md — entity, field chính, FK/quan hệ, enum/error code, rule chung, câu hỏi mở."

tags:
  - dft
  - internal
  - qa
  - testcase
  - xlsx
  - manual-testing
